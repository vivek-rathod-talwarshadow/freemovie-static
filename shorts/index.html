                                <span class="short-server-option-topline">
                                    <span class="short-server-option-label">${escapeHtml(server.name)}</span>
                                    ${server.is_recommended ? '<span class="short-server-badge">Likely</span>' : ""}
                                </span>
                                <span class="short-server-option-meta">${server.key === activeServer?.key ? "Currently selected for Shorts" : "Use this server for every Short"}</span>
                            </button>
                        `).join("")}
                    </div>
                </div>
            `;
        }

        function renderCard(item, index) {
            const liked = readLiked().includes(item.id);
            const episodeLabel = item.episode_number ? `S${item.season_number || 1} E${item.episode_number}` : "";
            const meta = [item.year, item.type, episodeLabel, item.rating ? `Rating ${item.rating}` : ""].filter(Boolean).join(" | ");
            return `
                <article class="short-card" data-index="${index}">
                    <img class="short-backdrop" src="${escapeHtml(item.backdrop || item.poster || "")}" alt="" loading="lazy" decoding="async">
                    <div class="portrait-stage">
                        <img class="poster-layer" src="${escapeHtml(item.poster || item.backdrop || "")}" alt="${escapeHtml(item.title)} poster" loading="${index < 2 ? "eager" : "lazy"}" decoding="async">
                        <div class="frame-mount" data-frame-mount></div>
                        <div class="frame-placeholder" data-placeholder>${index === 0 ? "Loading..." : "Swipe to play"}</div>
                        <div class="short-gradient"></div>
                    </div>
                    <div class="short-copy">
                        <h1 class="short-title">${escapeHtml(item.title)}</h1>
                        <div class="short-meta">${escapeHtml(meta)}</div>
                        ${item.plot ? `<div class="short-plot">${escapeHtml(item.plot)}</div>` : ""}
                        <div class="short-server-host">
                            ${buildServerSelect(item, index)}
                        </div>
                    </div>
                    <div class="short-actions">
                        <div>
                            <button class="action-button${liked ? " is-liked" : ""}" type="button" data-like="${index}" aria-label="Like">
                                <i class="fa fa-heart" aria-hidden="true"></i>
                            </button>
                            <div class="action-label">Like</div>
                        </div>
                        <div>
                            <button class="action-button" type="button" data-share="${index}" aria-label="Share">
                                <i class="fa fa-share" aria-hidden="true"></i>
                            </button>
                            <div class="action-label">Share</div>
                        </div>
                        <div>
                            <a class="action-button" href="${escapeHtml(item.detail_url || "#")}" aria-label="Details">
                                <i class="fa fa-info" aria-hidden="true"></i>
                            </a>
                            <div class="action-label">Info</div>
                        </div>
                    </div>
                </article>
            `;
        }

        function mountActiveFrame() {
            const card = feed.querySelector(`.short-card[data-index="${activeIndex}"]`);
            const item = items[activeIndex];
            if (!card || !item) return;

            if (activeFrameCard && activeFrameCard !== card) {
                activeFrameCard.querySelector("[data-frame-mount]").innerHTML = "";
                activeFrameCard.querySelector("[data-placeholder]").textContent = "Swipe to play";
            }

            const mount = card.querySelector("[data-frame-mount]");
            const placeholder = card.querySelector("[data-placeholder]");
            const server = selectedServer(item);
            if (!server?.url) {
                placeholder.textContent = "No server available";
                return;
            }

            if (!mount.querySelector("iframe")) {
                placeholder.textContent = "Loading...";
                const iframe = document.createElement("iframe");
                iframe.src = server.url;
                iframe.loading = "eager";
                iframe.referrerPolicy = "no-referrer";
                iframe.allow = "autoplay; fullscreen; accelerometer; encrypted-media; gyroscope; picture-in-picture";
                iframe.allowFullscreen = true;
                iframe.addEventListener("load", () => {
                    placeholder.textContent = "";
                    placeholder.style.pointerEvents = "none";
                }, { once: true });
                mount.appendChild(iframe);
            }
            activeFrameCard = card;
        }

        function closeServerPickers(exceptPicker = null) {
            document.querySelectorAll(".short-server-picker.is-open").forEach((picker) => {
                if (picker === exceptPicker) return;
                picker.classList.remove("is-open");
                picker.querySelector(".short-server-trigger")?.setAttribute("aria-expanded", "false");
            });
        }

        function switchServerForShort(index, serverKey) {
            const item = items[index];
            if (!item?.servers?.some((server) => server.key === serverKey)) return;
            writePreferredServerKey(serverKey);
            items.forEach((entry) => {
                if (entry?.servers?.some((server) => server.key === serverKey)) {
                    entry.active_server_key = serverKey;
                }
            });
            closeServerPickers();
            const currentScrollTop = feed.scrollTop;
            feed.querySelectorAll(".short-card").forEach((card) => {
                const cardIndex = Number(card.dataset.index || "0");
                const cardItem = items[cardIndex];
                if (!cardItem?.servers?.some((server) => server.key === serverKey)) return;
                const pickerHost = card.querySelector(".short-server-host");
                if (pickerHost) {
                    pickerHost.innerHTML = buildServerSelect(cardItem, cardIndex);
                }
            });
            bindCardEvents();
            feed.scrollTop = currentScrollTop;
            if (index === activeIndex && activeFrameCard) {
                activeFrameCard.querySelector("[data-frame-mount]")?.replaceChildren();
                const placeholder = activeFrameCard.querySelector("[data-placeholder]");
                if (placeholder) {
                    placeholder.textContent = "Loading...";
                    placeholder.style.pointerEvents = "";
                }
                mountActiveFrame();
            }
        }

        function bindCardEvents(root = feed) {
            root.querySelectorAll("[data-like]").forEach((button) => {
                if (button.dataset.bound) return;
                button.dataset.bound = "true";
                button.addEventListener("click", () => {
                    const item = items[Number(button.dataset.like)];
                    if (!item) return;
                    const liked = readLiked();
                    const nextLiked = liked.includes(item.id)
                        ? liked.filter((id) => id !== item.id)
                        : [item.id, ...liked.filter((id) => id !== item.id)];
                    writeLiked(nextLiked);
                    button.classList.toggle("is-liked", nextLiked.includes(item.id));
                });
            });

            root.querySelectorAll("[data-share]").forEach((button) => {
                if (button.dataset.bound) return;
                button.dataset.bound = "true";
                button.addEventListener("click", async () => {
                    const item = items[Number(button.dataset.share)];
                    const shareUrl = new URL(item?.detail_url || window.location.href, window.location.origin).href;
                    try {
                        if (navigator.share) {
                            await navigator.share({ title: item.title, url: shareUrl });
                        } else {
                            await navigator.clipboard.writeText(shareUrl);
                        }
                    } catch (error) {
                    }
                });
            });

            root.querySelectorAll("[data-server-select]").forEach((select) => {
                if (select.dataset.bound) return;
                select.dataset.bound = "true";
                select.addEventListener("change", () => {
                    const index = Number(select.dataset.serverSelect);
                    switchServerForShort(index, select.value);
                });
            });

            root.querySelectorAll("[data-server-picker]").forEach((picker) => {
                if (picker.dataset.bound) return;
                picker.dataset.bound = "true";
                const trigger = picker.querySelector(".short-server-trigger");
                trigger?.addEventListener("click", (event) => {
                    event.stopPropagation();
                    const willOpen = !picker.classList.contains("is-open");
                    closeServerPickers(willOpen ? picker : null);
                    picker.classList.toggle("is-open", willOpen);
                    trigger.setAttribute("aria-expanded", willOpen ? "true" : "false");
                });
                picker.querySelectorAll("[data-server-option]").forEach((button) => {
                    button.addEventListener("click", (event) => {
                        event.stopPropagation();
                        switchServerForShort(Number(picker.dataset.serverPicker || "0"), button.dataset.serverOption || "");
                    });
                });
            });
        }

        function observeCards() {
            observer?.disconnect();
            observer = new IntersectionObserver((entries) => {
                let bestEntry = null;
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;
                    if (!bestEntry || entry.intersectionRatio > bestEntry.intersectionRatio) {
                        bestEntry = entry;
                    }
                });
                if (!bestEntry || bestEntry.intersectionRatio < 0.62) return;
                activeIndex = Number(bestEntry.target.dataset.index || "0");
                mountActiveFrame();
                pruneRenderedCards();
                if (activeIndex >= items.length - 3) {
                    loadMoreShorts();
                }
            }, { threshold: [0.62, 0.74, 0.9] });
            feed.querySelectorAll(".short-card").forEach((card) => observer.observe(card));
        }

        function pruneRenderedCards() {
            const minIndex = Math.max(0, activeIndex - maxCardsBehind);
            const maxIndex = activeIndex + maxCardsAhead;
            let removedBeforeHeight = 0;
            feed.querySelectorAll(".short-card").forEach((card) => {
                const index = Number(card.dataset.index || "0");
                if (index >= minIndex && index <= maxIndex) return;
                if (card === activeFrameCard) return;
                if (index < activeIndex) {
                    removedBeforeHeight += card.getBoundingClientRect().height;
                }
                observer?.unobserve(card);
                card.querySelector("[data-frame-mount]")?.replaceChildren();
                card.remove();
            });
            if (removedBeforeHeight > 0) {
                feed.scrollTop = Math.max(0, feed.scrollTop - removedBeforeHeight);
            }
        }

        function appendFeedCards(newItems, startIndex) {
            if (!newItems.length) return;
            feed.insertAdjacentHTML("beforeend", newItems.map((item, offset) => renderCard(item, startIndex + offset)).join(""));
            bindCardEvents();
            observeCards();
            pruneRenderedCards();
        }

        function renderFeed() {
            applyPreferredServerToItems(items);
            if (!items.length) {
                feed.innerHTML = `<div class="empty-feed">Shorts could not load right now. Try refresh in a moment.</div>`;
                return;
            }
            const html = items.map(renderCard).join("");
            feed.innerHTML = html;
            bindCardEvents();
            observeCards();
            activeIndex = 0;
            feed.scrollTo({ top: 0, behavior: "auto" });
            mountActiveFrame();
        }

        async function fetchShorts(seed) {
            const response = await fetch(`${shortsApiUrl}?seed=${encodeURIComponent(seed)}`, {
                credentials: "same-origin",
                cache: "no-store",
            });
            const payload = await response.json();
            return applyPreferredServerToItems(Array.isArray(payload.items) ? payload.items : []);
        }

        async function loadMoreShorts() {
            if (loadingMore) return;
            loadingMore = true;
            try {
                const moreItems = await fetchShorts(`${Date.now()}-${items.length}`);
                const existingIds = new Set(items.map((item) => item.id));
                const freshItems = moreItems.filter((item) => !existingIds.has(item.id));
                const startIndex = items.length;
                items = items.concat(freshItems);
                appendFeedCards(freshItems, startIndex);
            } catch (error) {
            } finally {
                loadingMore = false;
            }
        }

        refreshFeedButton?.addEventListener("click", async () => {
            refreshFeedButton.disabled = true;
            try {
                items = await fetchShorts(`${Date.now()}-refresh`);
                activeFrameCard = null;
                renderFeed();
            } catch (error) {
            } finally {
                refreshFeedButton.disabled = false;
            }
        });

        document.addEventListener("click", (event) => {
            if (!event.target.closest(".short-server-picker")) {
                closeServerPickers();
            }
            if (!event.target.closest(".shorts-side-nav") && !event.target.closest(".shorts-menu-toggle")) {
                shortsSideNav?.classList.remove("is-open");
                shortsMenuToggle?.setAttribute("aria-expanded", "false");
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                closeServerPickers();
                shortsSideNav?.classList.remove("is-open");
                shortsMenuToggle?.setAttribute("aria-expanded", "false");
            }
        });

        shortsMenuToggle?.addEventListener("click", (event) => {
            event.stopPropagation();
            const isOpen = shortsSideNav?.classList.toggle("is-open");
            shortsMenuToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
        });

        renderFeed();
    </script>
</body>
</html>
